{% extends "base.html" %}

{% block title %}404 - Không Tìm Thấy Trang - Freight ERP{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card shadow-sm border-0 p-4">
      <div class="card-body">
        <div class="mb-4">
          <i class="bi bi-search text-secondary display-1"></i>
        </div>
        <h2 class="h4 fw-bold text-dark mb-2">Không Tìm Thấy Trang (404)</h2>
        <p class="text-muted mb-4">
          {{ error_message or "Đường dẫn bạn yêu cầu không tồn tại hoặc dữ liệu đã bị xóa khỏi hệ thống." }}
        </p>

        <div class="d-flex justify-content-center gap-2">
          <a href="/dashboard" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Về Bảng Điều Khiển
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
