<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ Thống Quản Lý Vận Tải Hàng Hóa{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 0.5px; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border: none; }
        .badge-active { background-color: #198754; }
        .badge-maintenance { background-color: #ffc107; color: #000; }
        .badge-inactive { background-color: #6c757d; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/trucks">
                <i class="bi bi-truck me-2"></i>Freight Transport ERP
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-nav"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'trucks' %}active fw-bold{% endif %}" href="/admin/trucks">
                            <i class="bi bi-truck-front me-1"></i> Quản lý Đội Xe
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'drivers' %}active fw-bold{% endif %}" href="/admin/drivers">
                            <i class="bi bi-person-badge me-1"></i> Quản lý Tài Xế
                        </a>
                    </li>
                </ul>
                <div class="d-flex text-white align-items-center">
                    <span class="badge bg-light text-dark me-3"><i class="bi bi-shield-check text-success"></i> Điều Phối Viên (DSP)</span>
                    <a href="/docs" target="_blank" class="btn btn-outline-light btn-sm"><i class="bi bi-file-code"></i> OpenAPI Docs</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
