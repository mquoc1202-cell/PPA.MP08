openapi: 3.0.3
info:
  title: Authentication & Access Control API (002)
  description: Endpoints for user authentication, session verification, logout, and role inspection.
  version: 1.0.0

paths:
  /api/v1/auth/login:
    post:
      summary: User Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated; sets HTTP-Only session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      tags: [Authentication]
      responses:
        '200':
          description: Session invalidated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'

  /api/v1/auth/me:
    get:
      summary: Get Current Logged-in User Profile
      tags: [Authentication]
      responses:
        '200':
          description: Profile retrieved from active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "dsp_user"
        password:
          type: string
          format: password
          example: "password123"

    UserSession:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "dsp_user"
        full_name:
          type: string
          example: "Nguyễn Văn Điều Phối"
        role:
          type: string
          enum: [DSP, SAL, MGR]
          example: "DSP"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserSession'
        error:
          type: string
          nullable: true
        meta:
          type: object

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserSession'
        error:
          type: string
          nullable: true
        meta:
          type: object

    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        error:
          type: string
          nullable: true
        meta:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: string
          example: "Tên đăng nhập hoặc mật khẩu không chính xác."
        meta:
          type: object
