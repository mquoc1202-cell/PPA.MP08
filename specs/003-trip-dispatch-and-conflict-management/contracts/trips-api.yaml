openapi: 3.0.3
info:
  title: Trip Dispatch & Schedule Management API (TRN-02)
  description: Endpoints for trip dispatching, resource assignment, schedule conflict checking, and schedule timelines.
  version: 1.0.0

paths:
  /api/v1/trips:
    get:
      summary: List Trips
      tags: [Trips]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [UNASSIGNED, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, COMPLETED, CANCELLED]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'

    post:
      summary: Create New Trip (Unassigned)
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created successfully in UNASSIGNED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '400':
          description: Invalid trip data

  /api/v1/trips/{id}:
    get:
      summary: Get Trip Details
      tags: [Trips]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed trip information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '404':
          description: Trip not found

  /api/v1/trips/{id}/assign:
    post:
      summary: Assign Truck and Driver to Trip (Dispatch)
      tags: [Dispatch]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTripRequest'
      responses:
        '200':
          description: Successfully dispatched; trip moved to ASSIGNED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '400':
          description: Business rule violation (overweight, resource inactive, invalid state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Schedule conflict detected for truck or driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'

  /api/v1/trips/{id}/reassign:
    post:
      summary: Reassign / Change Truck or Driver for Assigned Trip
      tags: [Dispatch]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignTripRequest'
      responses:
        '200':
          description: Successfully updated assignment and booking schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '400':
          description: Business rule violation or trip already picked up
        '409':
          description: Schedule conflict detected for new resource

  /api/v1/trips/{id}/unassign:
    post:
      summary: Unassign / Revoke Assignment from Trip
      tags: [Dispatch]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully revoked assignment; trip returned to UNASSIGNED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '400':
          description: Trip cannot be unassigned (already picked up or completed)

  /api/v1/schedule/trucks/{id}:
    get:
      summary: Get Schedule Bookings for Truck
      tags: [Schedule]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of bookings for truck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'

  /api/v1/schedule/drivers/{id}:
    get:
      summary: Get Schedule Bookings for Driver
      tags: [Schedule]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of bookings for driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'

components:
  schemas:
    CreateTripRequest:
      type: object
      required: [sender_name, sender_phone, pickup_address, delivery_address, cargo_weight_kg, cargo_type]
      properties:
        sender_name:
          type: string
          example: "Công ty TNHH Logistics Á Châu"
        sender_phone:
          type: string
          example: "0901234567"
        pickup_address:
          type: string
          example: "Kho A, KCN Nội Bài, Sóc Sơn, Hà Nội"
        delivery_address:
          type: string
          example: "Cảng Hải Phòng, Ngô Quyền, Hải Phòng"
        cargo_weight_kg:
          type: integer
          minimum: 1
          example: 4500
        cargo_type:
          type: string
          example: "Linh kiện điện tử"
        notes:
          type: string
          example: "Yêu cầu bạt che kín nước"

    AssignTripRequest:
      type: object
      required: [truck_id, driver_id, start_time, end_time]
      properties:
        truck_id:
          type: integer
          example: 1
        driver_id:
          type: integer
          example: 1
        start_time:
          type: string
          format: date-time
          example: "2026-11-24T08:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2026-11-24T17:00:00Z"

    ReassignTripRequest:
      type: object
      required: [truck_id, driver_id]
      properties:
        truck_id:
          type: integer
          example: 2
        driver_id:
          type: integer
          example: 2
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true

    TripItem:
      type: object
      properties:
        id:
          type: integer
        reference_code:
          type: string
        sender_name:
          type: string
        sender_phone:
          type: string
        pickup_address:
          type: string
        delivery_address:
          type: string
        cargo_weight_kg:
          type: integer
        cargo_type:
          type: string
        estimated_start_time:
          type: string
          format: date-time
          nullable: true
        estimated_end_time:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        assigned_truck_id:
          type: integer
          nullable: true
        assigned_driver_id:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true

    TripDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TripItem'
        error:
          type: string
          nullable: true

    TripListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripItem'
        meta:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total_items:
              type: integer

    BookingItem:
      type: object
      properties:
        id:
          type: integer
        resource_type:
          type: string
        resource_id:
          type: integer
        reference_code:
          type: string
        service_type:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string

    ScheduleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'

    ConflictResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            conflicting_bookings:
              type: array
              items:
                $ref: '#/components/schemas/BookingItem'
        error:
          type: string
          example: "Xe hoặc tài xế đã bị chiếm dụng trong khoảng thời gian này."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Khối lượng hàng hóa vượt quá tải trọng xe."
