openapi: 3.0.3
info:
  title: Truck Management API (TRN-01)
  description: API endpoints for managing trucks, plate normalization, capacity validation, and status transitions.
  version: 1.0.0

paths:
  /api/v1/trucks:
    get:
      summary: List trucks
      tags: [Trucks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, MAINTENANCE, INACTIVE]
        - name: search
          in: query
          description: Search by plate number or truck type
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of trucks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckListResponse'

    post:
      summary: Create a new truck
      tags: [Trucks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTruckRequest'
      responses:
        '201':
          description: Truck created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDetailResponse'
        '400':
          description: Validation error (e.g. capacity <= 0 or invalid plate format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (plate number already exists after normalization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/trucks/{id}:
    get:
      summary: Get truck details by ID
      tags: [Trucks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDetailResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update truck information
      tags: [Trucks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTruckRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDetailResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a truck (Hard delete forbidden if history exists)
      tags: [Trucks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Truck deleted (only if no transaction history)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: Prohibited hard deletion due to historical records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/trucks/{id}/status:
    patch:
      summary: Change truck status (ACTIVE, MAINTENANCE, INACTIVE)
      description: Validates future booking schedules before permitting transition to MAINTENANCE or INACTIVE.
      tags: [Trucks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTruckStatusRequest'
      responses:
        '200':
          description: Status changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDetailResponse'
        '409':
          description: Conflict due to existing future bookings or currently in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleConflictResponse'

components:
  schemas:
    Truck:
      type: object
      properties:
        id:
          type: integer
          example: 1
        plate_number:
          type: string
          example: "29C-123.45"
        normalized_plate:
          type: string
          example: "29C12345"
        truck_type:
          type: string
          example: "Xe thùng kín 5T"
        capacity_kg:
          type: integer
          example: 5000
        description:
          type: string
          nullable: true
          example: "Xe chạy tuyến cố định"
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, INACTIVE]
          example: "ACTIVE"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTruckRequest:
      type: object
      required: [plate_number, truck_type, capacity_kg]
      properties:
        plate_number:
          type: string
          example: "29C-123.45"
        truck_type:
          type: string
          example: "Xe thùng kín 5T"
        capacity_kg:
          type: integer
          minimum: 1
          example: 5000
        description:
          type: string
          nullable: true
          example: "Xe mới đăng kiểm"

    UpdateTruckRequest:
      type: object
      required: [plate_number, truck_type, capacity_kg]
      properties:
        plate_number:
          type: string
          example: "29C-123.45"
        truck_type:
          type: string
          example: "Xe thùng kín 5T"
        capacity_kg:
          type: integer
          minimum: 1
          example: 5500
        description:
          type: string
          nullable: true

    ChangeTruckStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, INACTIVE]
          example: "MAINTENANCE"
        reason:
          type: string
          nullable: true
          example: "Bảo dưỡng định kỳ"

    TruckListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Truck'
        error:
          type: string
          nullable: true
        meta:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total_items:
              type: integer

    TruckDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Truck'
        error:
          type: string
          nullable: true
        meta:
          type: object

    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        error:
          type: string
          nullable: true
        meta:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: string
          example: "Tải trọng xe bắt buộc phải lớn hơn 0 kg."
        meta:
          type: object

    ScheduleConflictResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            conflicting_bookings:
              type: array
              items:
                type: object
                properties:
                  booking_id:
                    type: integer
                  reference_code:
                    type: string
                  start_time:
                    type: string
                    format: date-time
                  end_time:
                    type: string
                    format: date-time
        error:
          type: string
          example: "Không thể đổi trạng thái: Xe đang có 2 lịch phân công trong tương lai."
        meta:
          type: object
